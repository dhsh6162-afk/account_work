<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard - Account Funds</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #07111f, #142b4a);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 25px 15px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      background: linear-gradient(135deg, #1976e8, #6046e8);

      font-size: 23px;
      font-weight: bold;
    }

    .header h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .header p {
      color: #9caec4;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .welcome-card {
      background: #0d1828;
      border: 1px solid #294766;

      border-radius: 20px;
      padding: 22px;

      margin-bottom: 18px;
    }

    .welcome-card h2 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    #usernameDisplay {
      color: #6eafff;
    }

    .welcome-card p {
      color: #aab9cc;
      font-size: 14px;
      line-height: 1.6;
    }

    .balance-card {
      background: linear-gradient(135deg, #1976e8, #6046e8);

      border-radius: 20px;

      padding: 25px;
      margin-bottom: 20px;
    }

    .balance-title {
      font-size: 13px;
      opacity: 0.85;
      margin-bottom: 8px;
    }

    .balance {
      font-size: 34px;
      font-weight: bold;
    }

    .menu-card {
      background: #0d1828;
      border: 1px solid #294766;

      border-radius: 20px;

      padding: 12px;
      margin-bottom: 18px;
    }

    .menu-btn {
      width: 100%;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px;

      margin-bottom: 8px;

      text-decoration: none;

      border-radius: 12px;

      background: #121f32;
      border: 1px solid #294766;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .menu-btn:last-child {
      margin-bottom: 0;
    }

    .menu-btn:hover {
      border-color: #2586ff;
    }

    .logout-btn {
      width: 100%;

      padding: 15px;

      border: 1px solid #ff5c5c;

      border-radius: 12px;

      background: transparent;

      color: #ff7777;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="header">

      <div class="logo">
        AF
      </div>

      <h1>ACCOUNT FUNDS</h1>

      <p>YOUR DASHBOARD</p>

    </div>


    <!-- WELCOME -->

    <div class="welcome-card">

      <h2>
        Welcome,
        <span id="usernameDisplay">User</span> 👋
      </h2>

      <p>
        Welcome to your Account Funds dashboard.
        Manage your account and payments from here.
      </p>

    </div>


    <!-- BALANCE -->

    <div class="balance-card">

      <div class="balance-title">
        AVAILABLE BALANCE
      </div>

      <div class="balance">
        ₹0.00
      </div>

    </div>


    <!-- MENU -->

    <div class="menu-card">

      <a
        href="payment.html"
        class="menu-btn">

        <span>💳 Deposit / Payment</span>

        <span>›</span>

      </a>


      <button
        class="menu-btn"
        type="button"
        onclick="comingSoon()">

        <span>📜 Transaction History</span>

        <span>›</span>

      </button>


      <button
        class="menu-btn"
        type="button"
        onclick="comingSoon()">

        <span>👤 My Profile</span>

        <span>›</span>

      </button>

    </div>


    <!-- LOGOUT -->

    <button
      type="button"
      class="logout-btn"
      onclick="logout()">

      Logout

    </button>

  </div>


  <script>

    // CHECK LOGIN

    const savedData =
      localStorage.getItem("account_funds_user");


    if (!savedData) {

      window.location.href =
        "index.html";

    } else {

      const userData =
        JSON.parse(savedData);


      document
        .getElementById("usernameDisplay")
        .textContent =
        userData.username;

    }


    // LOGOUT

    function logout() {

      const confirmLogout =
        confirm("Are you sure you want to logout?");


      if (confirmLogout) {

        localStorage.removeItem(
          "account_funds_user"
        );


        window.location.href =
          "index.html";

      }

    }


    // TEMPORARY BUTTONS

    function comingSoon() {

      alert(
        "This feature is coming soon!"
      );

    }

  </script>

</body>
</html>
