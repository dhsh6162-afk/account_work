<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        color: #222;
    }

    /* Navbar */
    .navbar {
        background: #1f2937;
        color: white;
        padding: 15px 8%;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .navbar h2 {
        font-size: 22px;
    }

    .navbar a {
        color: white;
        text-decoration: none;
        margin-left: 18px;
        font-size: 15px;
    }

    .navbar a:hover {
        opacity: 0.8;
    }

    /* Main */
    .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
    }

    .profile-card {
        background: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        overflow: hidden;
    }

    .profile-header {
        padding: 35px 25px;
        text-align: center;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        color: white;
    }

    .profile-avatar {
        width: 100px;
        height: 100px;
        margin: auto auto 15px;
        border-radius: 50%;
        background: white;
        color: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        font-weight: bold;
        border: 4px solid rgba(255,255,255,0.5);
    }

    .profile-header h1 {
        font-size: 25px;
        margin-bottom: 8px;
    }

    .profile-header p {
        opacity: 0.9;
    }

    .profile-body {
        padding: 30px;
    }

    .section-title {
        margin-bottom: 20px;
        font-size: 20px;
        color: #1f2937;
        border-bottom: 2px solid #e5e7eb;
        padding-bottom: 10px;
    }

    .profile-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    .info-box {
        background: #f8fafc;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #e5e7eb;
    }

    .info-box span {
        display: block;
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 7px;
    }

    .info-box strong {
        font-size: 16px;
        color: #111827;
        word-break: break-word;
    }

    /* Form */
    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: 600;
        color: #374151;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #2563eb;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
    }

    .save-btn {
        background: #2563eb;
        color: white;
    }

    .save-btn:hover {
        background: #1d4ed8;
    }

    .cancel-btn {
        background: #e5e7eb;
        color: #111827;
    }

    .cancel-btn:hover {
        background: #d1d5db;
    }

    .message {
        display: none;
        margin-top: 15px;
        padding: 12px;
        border-radius: 8px;
        background: #dcfce7;
        color: #166534;
    }

    /* Responsive */
    @media (max-width: 600px) {
        .navbar {
            padding: 15px 20px;
            flex-direction: column;
            gap: 12px;
        }

        .navbar a {
            margin: 0 8px;
        }

        .container {
            margin: 20px auto;
            padding: 12px;
        }

        .profile-grid {
            grid-template-columns: 1fr;
        }

        .profile-body {
            padding: 20px;
        }
    }
</style>

```
<!-- Navbar -->

<!-- Profile -->
<div class="container">

    <div class="profile-card">

        <div class="profile-header">
            <div class="profile-avatar" id="avatar">U</div>

            <h1 id="profileName">User Name</h1>

            <p id="profileEmail">user@email.com</p>
        </div>

        <div class="profile-body">

            <h2 class="section-title">My Profile</h2>

            <div class="profile-grid">

                <div class="info-box">
                    <span>Full Name</span>
                    <strong id="displayName">User Name</strong>
                </div>

                <div class="info-box">
                    <span>Email Address</span>
                    <strong id="displayEmail">user@email.com</strong>
                </div>

                <div class="info-box">
                    <span>Account Status</span>
                    <strong>Active</strong>
                </div>

                <div class="info-box">
                    <span>Account Type</span>
                    <strong>Standard User</strong>
                </div>

            </div>


            <h2 class="section-title">Edit Profile</h2>

            <form id="profileForm">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>


                <div class="buttons">

                    <button
                        type="submit"
                        class="save-btn"
                    >
                        Save Changes
                    </button>


                    <button
                        type="button"
                        class="cancel-btn"
                        onclick="resetProfile()"
                    >
                        Cancel
                    </button>

                </div>

            </form>


            <div
                class="message"
                id="successMessage"
            >
                Profile updated successfully!
            </div>

        </div>

    </div>

</div>


<script>

    /*
    =====================================
    LOAD PROFILE DATA
    =====================================
    */

    let userName =
        localStorage.getItem("userName")
        || "User Name";


    let userEmail =
        localStorage.getItem("userEmail")
        || "user@email.com";


    document.getElementById("profileName").textContent =
        userName;


    document.getElementById("displayName").textContent =
        userName;


    document.getElementById("profileEmail").textContent =
        userEmail;


    document.getElementById("displayEmail").textContent =
        userEmail;


    document.getElementById("name").value =
        userName;


    document.getElementById("email").value =
        userEmail;


    /*
    =====================================
    AVATAR INITIAL
    =====================================
    */

    function updateAvatar(name) {

        let firstLetter =
            name.charAt(0).toUpperCase();

        document
            .getElementById("avatar")
            .textContent =
            firstLetter;

    }


    updateAvatar(userName);



    /*
    =====================================
    SAVE PROFILE
    =====================================
    */

    document
        .getElementById("profileForm")
        .addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                let newName =
                    document
                    .getElementById("name")
                    .value
                    .trim();


                let newEmail =
                    document
                    .getElementById("email")
                    .value
                    .trim();


                if (
                    newName === ""
                    ||
                    newEmail === ""
                ) {

                    alert(
                        "Please fill all fields."
                    );

                    return;

                }


                /*
                Save data in browser
                */

                localStorage.setItem(
                    "userName",
                    newName
                );


                localStorage.setItem(
                    "userEmail",
                    newEmail
                );


                /*
                Update profile display
                */

                document
                    .getElementById("profileName")
                    .textContent =
                    newName;


                document
                    .getElementById("displayName")
                    .textContent =
                    newName;


                document
                    .getElementById("profileEmail")
                    .textContent =
                    newEmail;


                document
                    .getElementById("displayEmail")
                    .textContent =
                    newEmail;


                updateAvatar(newName);


                /*
                Show success message
                */

                let message =
                    document
                    .getElementById(
                        "successMessage"
                    );


                message.style.display =
                    "block";


                setTimeout(
                    function() {

                        message.style.display =
                            "none";

                    },
                    3000
                );

            }
        );



    /*
    =====================================
    RESET PROFILE FORM
    =====================================
    */

    function resetProfile() {

        document
            .getElementById("name")
            .value =
            localStorage.getItem(
                "userName"
            )
            || "User Name";


        document
            .getElementById("email")
            .value =
            localStorage.getItem(
                "userEmail"
            )
            || "user@email.com";

    }

</script>
