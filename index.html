<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Account Funds</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>ACCOUNT FUNDS</h1>

            <p class="subtitle">
                LIVE ACTIVATION & EARN COMMISSION
            </p>

            <h2>Create Account</h2>

            <form>

                <input
                    type="text"
                    placeholder="Enter Full Name"
                    required
                >

                <input
                    type="email"
                    placeholder="Enter Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Create Password"
                    required
                >

                <button type="submit">
                    REGISTER
                </button>

            </form>

            <p class="login-text">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</body>
</html>
